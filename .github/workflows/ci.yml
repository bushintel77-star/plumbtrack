name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://plumbtrack:plumbtrack@localhost:5432/plumbtrack

jobs:
  ci:
    name: Build, typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plumbtrack
          POSTGRES_PASSWORD: plumbtrack
          POSTGRES_DB: plumbtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plumbtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from packageManager in package.json — specifying it
        # here too makes action-setup v4 fail with "Multiple versions".

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run Prisma migrations
        run: pnpm db:migrate

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Lint all workspaces
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

  e2e:
    name: Web PWA e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Playwright browsers
        run: pnpm --filter @plumbtrack/web exec playwright install --with-deps chromium

      # dashboard-graphs and job-view-billable still assert seed-era UI
      # (open time entries at boot, drifted clock-in sheet labels) — tracked
      # in PRODUCTION_READINESS.md P0-2 alongside the HQ e2e rewrite.
      - name: Run web e2e suite
        run: pnpm --filter @plumbtrack/web exec playwright test --grep-invert "dashboard-graphs|job-view-billable"
